name: GTA 6 YouTube Discovery

on:
  workflow_dispatch:
  schedule:
    # Twice daily. GitHub may delay scheduled runs during busy periods.
    - cron: "17 4,16 * * *"

permissions:
  contents: write

concurrency:
  group: gta6-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover and rank public YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/discover.py
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: gta6-candidates-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
      - name: Persist duplicate-detection state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_video_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "Update discovered video IDs"
            git push
          fi
